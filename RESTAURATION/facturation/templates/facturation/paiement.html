{% extends 'base.html' %}

{% block content %}
<div class="max-w-md mx-auto mt-10 bg-white p-6 rounded shadow-md text-center">
    <h2 class="text-xl font-bold mb-4">Paiement pour votre commande</h2>
    <p><strong>Montant :</strong> {{ commande.plat.prix_unitaire }} FCFA</p>
    <p><strong>Plat :</strong> {{ commande.plat.nom }}</p>

    <img src="{% static 'images/orange.png' %}" alt="QR Code" class="mx-auto my-4 w-40 h-40">

    <form method="post">
        {% csrf_token %}
        {{ form.code_transaction.label_tag }}<br>
        {{ form.code_transaction }}
        <br><br>
        <button type="submit" class="bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600">
            Valider le paiement
        </button>
    </form>
</div>
{% endblock %}
