{% extends 'base.html' %}

{% block title %}Réserver une Table{% endblock %}
{% block header %}RÉSERVER UNE TABLE{% endblock %}

{% block content %}
<style>
  body {
    background-color: #fff8f0; /* même fond beige doux */
  }

  .form-wrapper {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 2rem;
  }

  form p {
    margin-bottom: 1.5rem;
  }

  form p label {
    font-weight: 600;
    display: block;
    margin-bottom: 0.5rem;
    color: #C98B53; /* brun clair chaleureux */
  }

  form p input,
  form p select,
  form p textarea {
    width: 100%;
    padding: 0.75rem;
    border: 2px solid #deb887; /* couleur bois */
    border-radius: 10px;
    font-size: 1rem;
    background-color: #fdfdfd;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
  }

  form p input:focus,
  form p select:focus,
  form p textarea:focus {
    border-color: #8B0000; /* rouge foncé */
    background-color: #ffffff;
    outline: none;
    box-shadow: 0 0 5px rgba(139, 0, 0, 0.3);
  }

  .card {
    border-radius: 12px;
    background-color: #fffaf5; /* fond doux légèrement rosé */
  }

  .card-header {
    border-top-left-radius: 12px;
    border-top-right-radius: 12px;
    background: linear-gradient(90deg, #8B0000, #C98B53);
  }

  .card-header h2 {
    color: white;
    font-weight: bold;
  }

  .card-footer {
    border-bottom-left-radius: 12px;
    border-bottom-right-radius: 12px;
    background-color: #f5f5f5;
  }

  .btn-success {
    background-color: #8B0000;
    border-color: #8B0000;
    font-weight: 600;
  }

  .btn-success:hover {
    background-color: #a90000;
    border-color: #a90000;
  }

</style>

<div class="form-wrapper">
  <div class="container" style="max-width: 700px;">
    <div class="card shadow-lg border-0">
      <div class="card-header text-white text-center py-3">
        <h2 class="mb-0">Réserver une Table</h2>
      </div>
      <div class="card-body p-5">
        <form method="post">
          {% csrf_token %}
          {{ form.as_p }}

          {% if plat_id %}
            <input type="hidden" name="plat_id" value="{{ plat_id }}">
          {% endif %}

          <button type="submit" class="btn btn-success w-100 mt-4">Réserver</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
