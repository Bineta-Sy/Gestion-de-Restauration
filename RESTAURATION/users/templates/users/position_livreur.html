{% extends 'base.html' %}

{% block title %}Suivi du Livreur{% endblock %}

{% block content %}
<h2>Suivi en temps réel du livreur : {{ livreur.nom }}</h2>
<div id="map" style="height: 500px;"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

<script>
    let map = L.map('map').setView([0, 0], 13);
    let marker;

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
    }).addTo(map);

    function updatePosition() {
        fetch("{% url 'users:position_livreur_json' livreur.id %}")
            .then(response => response.json())
            .then(data => {
                const lat = data.latitude;
                const lng = data.longitude;

                if (!lat || !lng) return;

                if (!marker) {
                    marker = L.marker([lat, lng]).addTo(map).bindPopup("Position actuelle du livreur").openPopup();
                    map.setView([lat, lng], 15);
                } else {
                    marker.setLatLng([lat, lng]);
                }
            });
    }

    updatePosition();
    setInterval(updatePosition, 10000); // Met à jour toutes les 10s
</script>
{% endblock %}
