{% extends 'base.html' %}

{% block title %}Connexion{% endblock %}
{% block header %}Se Connecter{% endblock %}

{% block content %}
<style>
  body {
    background-color: #f8f9fa;
    height: 90%;
    margin: 0;
    padding: 0;
  }

  .form-wrapper {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .card {
    border-radius: 12px;
    box-shadow: 0 10px 20px rgba(0, 0, 0, 0.08);
    max-width: 500px;
    width: 100%;
    background-color: #C98B53; /* <-- Couleur brun clair ici */
    overflow: hidden;
  }

  .card-header {
    background: linear-gradient(90deg, #8B0000, #6E0000); /* rouge profond (harmonieux avec #C98B53) */
    color: white;
    padding: 2rem;
    text-align: center;
    font-size: 1.8rem;
    font-weight: 700;
  }

  .card-body {
    padding: 2.5rem;
  }

  .form-group {
    position: relative;
    margin-bottom: 1.8rem;
  }

  .form-group input {
    width: 100%;
    height: 50px;
    padding: 1rem 0.75rem;
    border: 2px solid #ced4da;
    border-radius: 10px;
    font-size: 1rem;
    background-color: #fdfdfd;
    color: #212529;
    outline: none;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
  }

  .form-group input:focus {
    border-color: #8B0000;
    box-shadow: 0 0 5px rgba(139, 0, 0, 0.3);
  }

  .form-group label {
    position: absolute;
    top: -0.75rem;
    left: 0.75rem;
    background-color: #C98B53; /* assorti à la carte */
    padding: 0 0.25rem;
    font-size: 0.85rem;
    color: #8B0000;
    font-weight: 600;
  }

  .btn-submit {
    width: 100%;
    padding: 0.75rem;
    font-size: 1rem;
    background-color: #8B0000;
    color: white;
    border: none;
    border-radius: 10px;
    font-weight: 600;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    transition: background-color 0.2s ease;
  }

  .btn-submit:hover {
    background-color: #6E0000;
  }

  .card-footer {
    text-align: center;
    padding: 1.5rem;
    background-color: #f1f3f5;
    border-bottom-left-radius: 12px;
    border-bottom-right-radius: 12px;
  }

  .card-footer a {
    color: #8B0000;
    font-weight: 600;
    text-decoration: none;
  }

  .card-footer a:hover {
    text-decoration: underline;
    color: #6E0000;
  }
</style>


<div class="form-wrapper">
  <div class="card">
    <div class="card-header">
      Connexion à votre compte
    </div>
    <div class="card-body">
      <form method="post">
        {% csrf_token %}

        <div class="form-group">
          <label for="id_email">Adresse email</label>
          <input type="email" name="email" id="id_email" required>
        </div>

        <div class="form-group">
          <label for="id_password">Mot de passe</label>
          <input type="password" name="password" id="id_password" required>
        </div>

        <button type="submit" class="btn-submit">Se connecter</button>
      </form>
    </div>
    <div class="card-footer">
      Pas encore de compte ? <a href="{% url 'users:creer_compte' %}">Créer un compte</a>
    </div>
  </div>
</div>
{% endblock %}
